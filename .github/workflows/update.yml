name: Refresh airdrop ledger

on:
  schedule:
    - cron: "30 3 * * *"   # 03:30 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install --quiet openpyxl playwright

      - name: Install browser for client-rendered sources
        run: python -m playwright install --with-deps chromium

      - name: Scrape trackers
        run: python tools/scrape_trackers.py

      - name: Deep-verify guides (incremental, cached 7 days)
        run: python tools/verify.py --limit 150

      - name: Rebuild ledger
        run: python tools/build_ledger.py

      - name: Rebuild site
        run: python tools/build_site.py

      - name: Commit if changed
        run: |
          git config user.name "airdrop-bot"
          git config user.email "airdrop-bot@users.noreply.github.com"
          git add data/airdrops.json data/verified.json data/fetch-report.md ledger.md ledger.xlsx docs
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: daily airdrop ledger refresh"
            git push
          fi
