name: Refresh airdrop ledger

on:
  schedule:
    - cron: "30 3 * * *"   # 03:30 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install --quiet openpyxl playwright

      - name: Install browser for client-rendered sources
        run: python -m playwright install --with-deps chromium

      - name: Scrape trackers
        run: python tools/scrape_trackers.py

      - name: Deep-verify guides (incremental, cached 7 days)
        run: python tools/verify.py --limit 150

      - name: Rebuild ledger
        run: python tools/build_ledger.py

      - name: Rebuild site
        run: python tools/build_site.py

      - name: Open a pull request with the refresh
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bot/daily-refresh
          title: "daily: tracker refresh + verification"
          commit-message: "daily refresh: scrape, verify, rebuild ledger and site"
          body: |
            Automated refresh from CI.
            - scrape five trackers (airdrops.io stays stale when Cloudflare blocks runners)
            - deep-verify up to 150 guides (7-day cache)
            - rebuild ledger.md, ledger.xlsx, docs site
            Review the fetch report in `data/fetch-report.md` before merging.
          add-paths: |
            data/
            ledger.md
            ledger.xlsx
            docs/
