name: auto-merge verified dossiers

# Opt-in: add the "auto-merge" label to a dossier PR and it merges itself once CI is green.
# Without the label nothing happens, so a reviewer keeps full control by default.

on:
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: contains(github.event.pull_request.labels.*.name, 'auto-merge')
    runs-on: ubuntu-latest
    steps:
      - name: Guard - only dossier branches from this repo
        run: |
          case "${{ github.event.pull_request.head.ref }}" in
            verify/*) echo "branch ok" ;;
            *) echo "refusing: ${{ github.event.pull_request.head.ref }}"; exit 1 ;;
          esac
          case "${{ github.event.pull_request.head.repo.full_name }}" in
            "${{ github.repository }}") echo "same repo ok" ;;
            *) echo "refusing: fork pr"; exit 1 ;;
          esac
      - name: Wait for validate-drops
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 30); do
            state=$(gh pr checks "${{ github.event.pull_request.number }}" \
              --repo "${{ github.repository }}" --json name,state \
              --jq '.[] | select(.name=="validate") | .state' 2>/dev/null | head -1)
            echo "attempt $i: $state"
            [ "$state" = "SUCCESS" ] && break
            [ "$state" = "FAILURE" ] && { echo "CI failed, not merging"; exit 1; }
            sleep 20
          done
      - name: Merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" --squash --delete-branch \
            --subject "verify: ${{ github.event.pull_request.title }}"
